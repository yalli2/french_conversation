<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Français Conversation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="index.html"><span class="flag"><i></i><i></i><i></i></span> <span class="bt">Français Conversation</span></a>
  <span class="sp"></span>
  <select class="btn sm" id="jump" aria-label="단원 이동"></select>
  <button class="btn sm" onclick="FC.voicePanel()">🔊 <span class="bt2">음성</span></button>
</div></header>
<div id="app"><div class="wrap muted">Chargement…</div></div>
<footer class="footer">Français Conversation · 국제학교 프랑스어 회화 수업용 학습 사이트 · 다인에듀 후안샘<br>모든 대화문과 연습문제는 수업용으로 새로 각색·작성되었습니다.</footer>
<script src="assets/units.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  const n = Math.max(0, Math.min(18, parseInt(new URLSearchParams(location.search).get('u') || '1', 10) || 0));
  const j = document.getElementById('jump');
  j.innerHTML = FC.META.map(m => `<option value="${m.n}" ${m.n===n?'selected':''}>${m.n===0?'Intro':'U'+m.n} · ${m.fr}</option>`).join('');
  j.onchange = () => location.href = 'unit.html?u=' + j.value;
  const s = document.createElement('script');
  s.src = 'data/u' + String(n).padStart(2,'0') + '.js';
  s.onload = () => FC.renderUnit(n);
  s.onerror = () => document.getElementById('app').innerHTML = '<div class="wrap">단원 데이터를 불러오지 못했습니다.</div>';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
